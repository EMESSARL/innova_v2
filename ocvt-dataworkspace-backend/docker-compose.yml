services:
  ocvt-dataws-module:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "$SERVER_PORT:$SERVER_PORT"
    networks:
      - app-network

  fastapi-service:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    restart: always
    ports:
      - "$FASTAPI_PORT:$FASTAPI_PORT"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
